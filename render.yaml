services:
  - type: web
    name: causalpacket-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: CAUSALPACKET_ALLOWED_ORIGINS
        sync: false
      - key: CAUSALPACKET_LAB_TIMEOUT_SECONDS
        value: "60"
